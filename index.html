<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محرك شطرنج + Polyglot Book</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--light:#f0d9b5;--dark:#b58863;--panel:#1e212c;--panel2:#262a38}
  body{font-family:'Segoe UI',Tahoma,sans-serif;
    background:radial-gradient(circle at 50% -10%,#2c3040,#0e0f15 65%);
    color:#e9eaf0;min-height:100vh;padding:18px}
  .app{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1200px;margin:0 auto}
  .board-outer{position:relative;padding:26px;border-radius:18px;
    background:linear-gradient(145deg,#3b4055,#20232f);
    box-shadow:0 30px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.09)}
  #board{position:relative;width:min(74vh,68vw,600px);aspect-ratio:1;border-radius:6px;overflow:hidden;
    direction:ltr;touch-action:none;box-shadow:0 0 0 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.55);
    user-select:none;-webkit-user-select:none}
  .sq{position:absolute;top:0;left:0;width:12.5%;height:12.5%}
  .sq.light{background:var(--light)}.sq.dark{background:var(--dark)}
  .sq.last::before{content:'';position:absolute;inset:0;background:rgba(255,236,80,.36)}
  .sq.check::before{content:'';position:absolute;inset:0;
    background:radial-gradient(circle,rgba(255,45,45,.95),rgba(255,45,45,0) 72%)}
  .sq.sel::after{content:'';position:absolute;inset:0;
    background:rgba(255,196,0,.48);box-shadow:inset 0 0 0 4px rgba(255,170,0,.95)}
  .sq.tgt::after{content:'';position:absolute;left:50%;top:50%;width:30%;height:30%;
    transform:translate(-50%,-50%);border-radius:50%;background:rgba(15,20,15,.34)}
  .sq.tgt.cap::after{content:'';position:absolute;inset:7%;width:auto;height:auto;left:7%;top:7%;
    transform:none;border-radius:50%;background:transparent;border:6px solid rgba(15,20,15,.32)}
  .pieces{position:absolute;inset:0;pointer-events:none}
  .piece{position:absolute;top:0;left:0;width:12.5%;height:12.5%;
    display:flex;align-items:center;justify-content:center;
    font-size:min(9.2vh,8.4vw,74px);line-height:1;will-change:transform;
    font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2',sans-serif}
  .piece.w{color:#fff;text-shadow:0 0 1px #222,1px 1px 0 #2a2a2a,-1px 1px 0 #2a2a2a,1px -1px 0 #2a2a2a,-1px -1px 0 #2a2a2a,0 2px 4px rgba(0,0,0,.55)}
  .piece.b{color:#1b1b1e;text-shadow:0 0 1px #000,1px 1px 0 #d6d6d6,-1px 1px 0 #d6d6d6,1px -1px 0 #d6d6d6,-1px -1px 0 #d6d6d6,0 2px 4px rgba(0,0,0,.55)}
  .panel{width:340px;background:linear-gradient(180deg,var(--panel),#171a24);border-radius:18px;padding:18px;
    border:1px solid rgba(255,255,255,.07);box-shadow:0 24px 60px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:12px}
  .panel h1{font-size:16px;font-weight:800;
    background:linear-gradient(90deg,#8ef0c8,#6cc6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .status{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:13px;
    border:1px solid rgba(255,255,255,.06);line-height:1.8}
  .status .row{display:flex;justify-content:space-between;gap:8px}
  .status .k{color:#8b90a8;font-size:12px}
  .status .v{font-weight:700;font-variant-numeric:tabular-nums}
  .turn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .dot{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #333 inset}
  .dot.b{background:#1b1b1e;box-shadow:0 0 0 2px #ddd inset}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .controls label{font-size:11px;color:#8b90a8;display:block;margin-bottom:4px}
  select,button{font-family:inherit;font-size:13px;border-radius:10px;border:1px solid rgba(255,255,255,.09);
    background:#2c3142;color:#e9eaf0;padding:8px 10px;cursor:pointer;transition:.16s}
  select:hover,button:hover{background:#363c50}
  button.primary{background:linear-gradient(135deg,#2f9e79,#1f7a5c);border-color:#2f9e79;font-weight:700}
  button:disabled{opacity:.5;cursor:not-allowed}
  .moves{background:#15171f;border-radius:12px;padding:10px;height:150px;overflow-y:auto;
    font-size:13px;border:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
  .moves .mv{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;padding:3px 4px;border-radius:6px}
  .moves .mv:nth-child(odd){background:rgba(255,255,255,.025)}
  .moves .num{color:#727892;font-size:12px}
  .moves .san{padding:1px 6px;border-radius:5px}
  .moves .san.last{background:rgba(127,209,174,.18);color:#9ff0cd}
  .promo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
  .promo.on{display:flex}
  .promo .box{background:#232735;padding:18px 22px;border-radius:16px;border:1px solid rgba(255,255,255,.1);text-align:center}
  .promo .opts{display:flex;gap:10px}
  .promo .opts div{width:64px;height:64px;border-radius:12px;background:#2f3547;display:flex;
    align-items:center;justify-content:center;font-size:42px;cursor:pointer;transition:.15s;
    font-family:'Segoe UI Symbol',sans-serif}
  .promo .opts div:hover{background:#3d465e;transform:translateY(-3px)}
  .book-box{background:#15171f;border-radius:10px;padding:10px;border:1px solid rgba(255,255,255,.06);font-size:12px}
  .book-status{font-size:11px;color:#f88;margin-top:6px;line-height:1.5}
  .book-status.ok{color:#8f8}
  .book-status.loading{color:#8cf}
  .book-progress{margin-top:6px;height:6px;background:#2c3142;border-radius:3px;overflow:hidden;display:none}
  .book-progress.on{display:block}
  .book-progress > div{height:100%;background:linear-gradient(90deg,#6cc6ff,#8ef0c8);width:0%;transition:width .15s}
</style>
</head>

function kingSafety(kSq, enemyColor, phase, pieceList, pieceTypes, pieceCount){
  if(kSq<0)return 0;
  var us = enemyColor^1;
  var kf = kSq&7, kr = kSq>>3;
  var danger = 0;
  if(phase > 8){
    var rankFromHome = (us===WHITE) ? (7-kr) : kr;
    if(rankFromHome >= 3) danger += 60;
    else if(rankFromHome >= 2) danger += 25;
  }
  var attackerCount=0, weight=0, proxDanger=0;
  for(var i=0;i<pieceCount;i++){
    var sq = pieceList[i];
    var t = pieceTypes[i];
    if(t===KING) continue;
    var dr = (sq>>3) - kr; if(dr<0) dr=-dr;
    var df = (sq&7) - kf; if(df<0) df=-df;
    var dist = dr>df?dr:df;
    if(dist<=2) proxDanger += (3-dist) * KING_ATTACK_WEIGHT[t] * 2;
    if(dist > 4) continue;
    var hit = false;
    if(t===PAWN){
      var at=ATK_PAWN[enemyColor][sq];
      for(var a=0;a<at.length&&!hit;a++){
        var az=at[a], adr=(az>>3)-kr, adf=(az&7)-kf;
        if(adr<0)adr=-adr; if(adf<0)adf=-adf;
        if(adr<=1&&adf<=1) hit=true;
      }
    } else if(t===KNIGHT){
      var at2=ATK_KNIGHT[sq];
      for(var a2=0;a2<at2.length&&!hit;a2++){
        var az2=at2[a2], adr2=(az2>>3)-kr, adf2=(az2&7)-kf;
        if(adr2<0)adr2=-adr2; if(adf2<0)adf2=-adf2;
        if(adr2<=1&&adf2<=1) hit=true;
      }
    } else {
      var raysB = (t===BISHOP||t===QUEEN) ? RAY_BISHOP[sq] : null;
      var raysR = (t===ROOK||t===QUEEN) ? RAY_ROOK[sq] : null;
      if(raysB){
        for(var d=0;d<4&&!hit;d++){
          var ray=raysB[d];
          for(var j=0;j<ray.length;j++){
            var s2=ray[j], adr3=(s2>>3)-kr, adf3=(s2&7)-kf;
            if(adr3<0)adr3=-adr3; if(adf3<0)adf3=-adf3;
            if(adr3<=1&&adf3<=1){hit=true;break;}
            if(board[s2]!==0)break;
          }
        }
      }
      if(raysR&&!hit){
        for(var d2=0;d2<4&&!hit;d2++){
          var ray2=raysR[d2];
          for(var j2=0;j2<ray2.length;j2++){
            var s3=ray2[j2], adr4=(s3>>3)-kr, adf4=(s3&7)-kf;
            if(adr4<0)adr4=-adr4; if(adf4<0)adf4=-adf4;
            if(adr4<=1&&adf4<=1){hit=true;break;}
            if(board[s3]!==0)break;
          }
        }

    }
    if(hit){attackerCount++;weight+=KING_ATTACK_WEIGHT[t];}
  }
  if(attackerCount>=2) danger += weight*attackerCount*3;
  danger += proxDanger;
  var openFiles = 0;
  for(var df3=-1;df3<=1;df3++){
    var f2=kf+df3; if(f2<0||f2>7) continue;

}

function pawnShield(kSq,pawnCnt,pawnMinMax,color){

function evaluate(){
  if(countNonKing()<=4){var eg=endgameEval();if(eg!==null)return eg}
  var i,sq,p,c,t,f,r,rel,pstIdx;
  var mgW=0,egW=0,mgB=0,egB=0,phase=0;
  var wKing=-1,bKing=-1;
  var wBishop=0,bBishop=0;
  var wPawnD=0,wPawnL=0,bPawnD=0,bPawnL=0;
  var wNP=0,bNP=0;
  var wQSq=-1,bQSq=-1;
  var wMaterial=0,bMaterial=0;
  for(i=0;i<8;i++){wPawnCnt[i]=0;bPawnCnt[i]=0;wPawnMin[i]=8;bPawnMin[i]=8;wPawnMax[i]=-1;bPawnMax[i]=-1;}
  for(sq=0;sq<64;sq++){
    p=board[sq];if(p===0)continue;
    c=p>>3;t=p&7;f=sq&7;r=sq>>3;
    rel=(c===WHITE)?sq:((7-r)*8+f);
    pstIdx=rel;
    phase+=PHASE[t];
    if(t!==KING){
      if(c===WHITE) wMaterial += MG_VALUE[t];
      else bMaterial += MG_VALUE[t];
    }
    var mgVal=MG_VALUE[t]+MG_PST[t][pstIdx];
    var egVal=EG_VALUE[t]+EG_PST[t][pstIdx];
    if(c===WHITE){mgW+=mgVal;egW+=egVal;wPSq[wNP]=sq;wPTy[wNP]=t;wNP++;}
    else{mgB+=mgVal;egB+=egVal;bPSq[bNP]=sq;bPTy[bNP]=t;bNP++;}
    if(t===PAWN){
      if(c===WHITE){wPawnCnt[f]++;if(r>wPawnMax[f])wPawnMax[f]=r;if(r<wPawnMin[f])wPawnMin[f]=r;if(sqColor(sq)===0)wPawnD++;else wPawnL++;}
      else{bPawnCnt[f]++;if(r>bPawnMax[f])bPawnMax[f]=r;if(r<bPawnMin[f])bPawnMin[f]=r;if(sqColor(sq)===0)bPawnD++;else bPawnL++;}
    } else if(t===BISHOP){if(c===WHITE)wBishop++;else bBishop++;}
    else if(t===KING){if(c===WHITE)wKing=sq;else bKing=sq;}
    else if(t===QUEEN){if(c===WHITE)wQSq=sq;else bQSq=sq;}
  }
  var KN_MG=[-30,-20,-12,-6,-2,2,6,10,14], KN_EG=[-34,-24,-14,-8,-2,4,10,14,18];
  var BI_MG=[-24,-16,-10,-6,-2,2,5,8,11,13,15,17,18,19], BI_EG=[-28,-20,-12,-6,-1,4,8,12,15,17,19,20,21,22];
  var RK_MG=[-18,-12,-6,-1,3,6,9,12,14,16,17,18,18,19,19], RK_EG=[-22,-16,-8,-2,3,7,10,13,15,17,18,19,20,21,22];
  var QN_MG=[-20,-14,-8,-3,1,4,7,9,11,13,14,15,16,17,18,19,20,20,21,21,22,22,23,23,24,24,25,25];
  var QN_EG=[-24,-18,-11,-4,1,5,9,12,14,16,18,19,20,21,22,23,23,24,24,25,25,25,26,26,26,27,27,27];
  for(i=0;i<wNP;i++){
    sq=wPSq[i];t=wPTy[i];
    if(t===KNIGHT){var m=mobilityKnight(sq,WHITE);if(m>8)m=8;mgW+=KN_MG[m];egW+=KN_EG[m];}
    else if(t===BISHOP){var m2=mobilityBishop(sq,WHITE);if(m2>13)m2=13;mgW+=BI_MG[m2];egW+=BI_EG[m2];}
    else if(t===ROOK){var m3=mobilityRook(sq,WHITE);if(m3>14)m3=14;mgW+=RK_MG[m3];egW+=RK_EG[m3];}
    else if(t===QUEEN){var m4=mobilityBishop(sq,WHITE)+mobilityRook(sq,WHITE);if(m4>27)m4=27;mgW+=QN_MG[m4];egW+=QN_EG[m4];}
  }
  for(i=0;i<bNP;i++){
    sq=bPSq[i];t=bPTy[i];
    if(t===KNIGHT){var n=mobilityKnight(sq,BLACK);if(n>8)n=8;mgB+=KN_MG[n];egB+=KN_EG[n];}
    else if(t===BISHOP){var n2=mobilityBishop(sq,BLACK);if(n2>13)n2=13;mgB+=BI_MG[n2];egB+=BI_EG[n2];}
    else if(t===ROOK){var n3=mobilityRook(sq,BLACK);if(n3>14)n3=14;mgB+=RK_MG[n3];egB+=RK_EG[n3];}
    else if(t===QUEEN){var n4=mobilityBishop(sq,BLACK)+mobilityRook(sq,BLACK);if(n4>27)n4=27;mgB+=QN_MG[n4];egB+=QN_EG[n4];}
  }
  var DOUBLED_MG=-11,DOUBLED_EG=-20,ISOLATED_MG=-13,ISOLATED_EG=-16,CONNECTED_MG=6,CONNECTED_EG=5;
  for(f=0;f<8;f++){
    var wc=wPawnCnt[f],bc=bPawnCnt[f];
    var wL=f>0?wPawnCnt[f-1]:0,wR=f<7?wPawnCnt[f+1]:0;
    var bL=f>0?bPawnCnt[f-1]:0,bR=f<7?bPawnCnt[f+1]:0;
    if(wc>1){mgW+=DOUBLED_MG*(wc-1);egW+=DOUBLED_EG*(wc-1);}
    if(bc>1){mgB+=DOUBLED_MG*(bc-1);egB+=DOUBLED_EG*(bc-1);}
    if(wc>0&&wL===0&&wR===0){mgW+=ISOLATED_MG*wc;egW+=ISOLATED_EG*wc;}
    if(bc>0&&bL===0&&bR===0){mgB+=ISOLATED_MG*bc;egB+=ISOLATED_EG*bc;}
  }
  var PASSED_MG=[0,10,25,50,90,160,300,0], PASSED_EG=[0,25,60,110,180,320,600,0];
  for(i=0;i<wNP;i++){
    if(wPTy[i]!==PAWN)continue;
    sq=wPSq[i];f=sq&7;r=sq>>3;
    var blocked=false;
    for(var ff=f-1;ff<=f+1&&!blocked;ff++){if(ff<0||ff>7)continue;if(bPawnMin[ff]<r)blocked=true;}
    if(!blocked){var adv=7-r;mgW+=PASSED_MG[adv];egW+=PASSED_EG[adv];if(f===0||f===7){mgW-=15;egW-=25;}}
    var sup=false;
    if(f>0&&wPawnCnt[f-1]>0&&wPawnMax[f-1]===r)sup=true;
    if(f<7&&wPawnCnt[f+1]>0&&wPawnMax[f+1]===r)sup=true;
    if(sup){mgW+=CONNECTED_MG;egW+=CONNECTED_EG;}
  }
  for(i=0;i<bNP;i++){
    if(bPTy[i]!==PAWN)continue;
    sq=bPSq[i];f=sq&7;r=sq>>3;
    var blocked2=false;
    for(var ff2=f-1;ff2<=f+1&&!blocked2;ff2++){if(ff2<0||ff2>7)continue;if(wPawnMax[ff2]>r)blocked2=true;}
    if(!blocked2){var adv2=r;mgB+=PASSED_MG[adv2];egB+=PASSED_EG[adv2];if(f===0||f===7){mgB-=15;egB-=25;}}
    var sup2=false;
    if(f>0&&bPawnCnt[f-1]>0&&bPawnMin[f-1]===r)sup2=true;
    if(f<7&&bPawnCnt[f+1]>0&&bPawnMin[f+1]===r)sup2=true;
    if(sup2){mgB+=CONNECTED_MG;egB+=CONNECTED_EG;}
  }
  if(wBishop>=2){mgW+=30;egW+=50;}
  if(bBishop>=2){mgB+=30;egB+=50;}
  for(i=0;i<wNP;i++){if(wPTy[i]!==BISHOP)continue;sq=wPSq[i];var ownP=(sqColor(sq)===0)?wPawnD:wPawnL;mgW-=3*ownP;egW-=3*ownP;}
  for(i=0;i<bNP;i++){if(bPTy[i]!==BISHOP)continue;sq=bPSq[i];var ownP2=(sqColor(sq)===0)?bPawnD:bPawnL;mgB-=3*ownP2;egB-=3*ownP2;}
  for(i=0;i<wNP;i++){if(wPTy[i]!==ROOK)continue;sq=wPSq[i];f=sq&7;r=sq>>3;
    if(wPawnCnt[f]===0){if(bPawnCnt[f]===0){mgW+=24;egW+=12;}else{mgW+=11;egW+=6;}}
    if(r===1){mgW+=22;egW+=50;}}
  for(i=0;i<bNP;i++){if(bPTy[i]!==ROOK)continue;sq=bPSq[i];f=sq&7;r=sq>>3;
    if(bPawnCnt[f]===0){if(wPawnCnt[f]===0){mgB+=24;egB+=12;}else{mgB+=11;egB+=6;}}
    if(r===6){mgB+=22;egB+=35;}}
  for(i=0;i<wNP;i++){
    if(wPTy[i]!==ROOK)continue;
    sq=wPSq[i];r=sq>>3;
    if(r===1 && bKing>=0 && (bKing>>3)>=6){
      var bkF=bKing&7; var bonus=35;
      if(bkF===0||bkF===7) bonus=(bonus*3)>>1;
      for(var pf=bkF-1;pf<=bkF+1;pf++){if(pf<0||pf>7)continue;if(board[8+pf]===pc(PAWN,BLACK)) bonus+=15;}
      mgW+=bonus; egW+=(bonus*17)/10|0;
    }
  }
  for(i=0;i<bNP;i++){
    if(bPTy[i]!==ROOK)continue;
    sq=bPSq[i];r=sq>>3;
    if(r===6 && wKing>=0 && (wKing>>3)<=1){
      var wkF=wKing&7; var bonusB=35;
      if(wkF===0||wkF===7) bonusB=(bonusB*3)>>1;
      for(var pfB=wkF-1;pfB<=wkF+1;pfB++){if(pfB<0||pfB>7)continue;if(board[48+pfB]===pc(PAWN,WHITE)) bonusB+=15;}
      mgB+=bonusB; egB+=(bonusB*17)/10|0;
    }
  }
  var ph0 = phase>24?24:phase;
  mgW -= kingSafety(wKing, BLACK, ph0, bPSq, bPTy, bNP);
  mgB -= kingSafety(bKing, WHITE, ph0, wPSq, wPTy, wNP);
  mgW += pawnShield(wKing,wPawnCnt,wPawnMax,WHITE);
  mgB += pawnShield(bKing,bPawnCnt,bPawnMin,BLACK);
  if(ph0 > 12){
    if(wQSq >= 0){
      var nearSupport = false;
      var wQAdj = ATK_KING[wQSq];
      for(var k=0;k<wQAdj.length;k++){var pp = board[wQAdj[k]];if(pp && (pp>>3)===WHITE && (pp&7)!==KING){nearSupport=true;break;}}
      if(!nearSupport) mgW -= 30;
    }
    if(bQSq >= 0){
      var nearSupportB = false;
      var bQAdj = ATK_KING[bQSq];
      for(var k2=0;k2<bQAdj.length;k2++){var pp2 = board[bQAdj[k2]];if(pp2 && (pp2>>3)===BLACK && (pp2&7)!==KING){nearSupportB=true;break;}}
      if(!nearSupportB) mgB -= 30;
    }
  }
  if(ph0 <= 10){
    var wKCenter = 4 - Math.max(Math.abs((wKing&7)-3),Math.abs((wKing&7)-4)) - Math.max(Math.abs((wKing>>3)-3),Math.abs((wKing>>3)-4));
    var bKCenter = 4 - Math.max(Math.abs((bKing&7)-3),Math.abs((bKing&7)-4)) - Math.max(Math.abs((bKing>>3)-3),Math.abs((bKing>>3)-4));
    egW += wKCenter * 12; egB += bKCenter * 12;
  }
  var ph=ph0;
  var mgDiff=mgW-mgB, egDiff=egW-egB;
  var score=((mgDiff*ph)+(egDiff*(24-ph)))/24|0;
  score=(side===WHITE)?score:-score;
  var matDiff = wMaterial - bMaterial;
  if(side===BLACK) matDiff = -matDiff;
  if(ph > 10 && Math.abs(matDiff) >= 300){score += (matDiff>0 ? 30 : -30);}
  return score+15;
}

var SEE_VAL=[0,100,320,330,500,900,20000];
var _seeSeq=new Int32Array(32);
function seeFindLVA(sq,color,remLo,remHi){
  var b=board;
  var pwn=pc(PAWN,color),kn=pc(KNIGHT,color),kg=pc(KING,color);
  var bsh=pc(BISHOP,color),rk=pc(ROOK,color),qn=pc(QUEEN,color);
  var p1=ATK_PAWN[color^1][sq];
  for(var i=0,L=p1.length;i<L;i++){var s=p1[i];
    if(s<32?(remLo>>>s)&1:(remHi>>>(s-32))&1)continue;
    if(b[s]===pwn)return s|(PAWN<<6);}
  var n1=ATK_KNIGHT[sq];
  for(var i2=0,L2=n1.length;i2<L2;i2++){var s2=n1[i2];
    if(s2<32?(remLo>>>s2)&1:(remHi>>>(s2-32))&1)continue;
    if(b[s2]===kn)return s2|(KNIGHT<<6);}
  var bR=RAY_BISHOP[sq];
  for(var d=0;d<4;d++){var ray=bR[d];
    for(var j=0,M=ray.length;j<M;j++){var s3=ray[j];
      if(s3<32?(remLo>>>s3)&1:(remHi>>>(s3-32))&1)continue;
      var p=b[s3];if(p===0)continue;
      if(p===bsh)return s3|(BISHOP<<6);
      if(p===qn)return s3|(QUEEN<<6);
      break;}}
  var rR=RAY_ROOK[sq];
  for(var e=0;e<4;e++){var ray2=rR[e];
    for(var j2=0,M2=ray2.length;j2<M2;j2++){var s4=ray2[j2];
      if(s4<32?(remLo>>>s4)&1:(remHi>>>(s4-32))&1)continue;
      var p2=b[s4];if(p2===0)continue;
      if(p2===rk)return s4|(ROOK<<6);
      if(p2===qn)return s4|(QUEEN<<6);
      break;}}
  var k1=ATK_KING[sq];
  for(var i4=0,L4=k1.length;i4<L4;i4++){var s5=k1[i4];
    if(s5<32?(remLo>>>s5)&1:(remHi>>>(s5-32))&1)continue;
    if(b[s5]===kg)return s5|(KING<<6);}
  return -1;
}
function see(move){
  var from=move&63,to=(move>>6)&63,promo=(move>>12)&7,flag=(move>>15)&7;
  var capSq=-1,v0,ourVal;
  if(flag===FLAG_EP){capSq=(side===WHITE)?to+8:to-8;v0=SEE_VAL[PAWN];ourVal=SEE_VAL[PAWN];}
  else{
    var cp=board[to];
    v0=(cp!==0)?SEE_VAL[cp&7]:0;
    if(promo){v0+=SEE_VAL[promo]-SEE_VAL[PAWN];ourVal=SEE_VAL[promo];}
    else ourVal=SEE_VAL[board[from]&7];
  }
  if(v0===0&&promo===0)return 0;
  var remLo=0,remHi=0;
  if(from<32)remLo|=(1<<from);else remHi|=(1<<(from-32));
  if(capSq>=0){if(capSq<32)remLo|=(1<<capSq);else remHi|=(1<<(capSq-32));}
  _seeSeq[0]=v0;
  var n=1,stm=side^1,nextVal=ourVal;
  while(n<32){
    var atk=seeFindLVA(to,stm,remLo,remHi);
    if(atk<0)break;
    var atkSq=atk&63,atkType=atk>>6;
    _seeSeq[n++]=nextVal;
    nextVal=SEE_VAL[atkType];
    if(atkSq<32)remLo|=(1<<atkSq);else remHi|=(1<<(atkSq-32));
    stm^=1;
  }
  var V=0;
  for(var i=n-1;i>=1;i--){V=_seeSeq[i]-V;if(V<0)V=0;}
  return _seeSeq[0]-V;
}
function seeGE(move,threshold){return see(move)>=threshold}

var TT_BITS=21,TT_SIZE=1<<TT_BITS,TT_MASK=TT_SIZE-1;
var ttKey=new Int32Array(TT_SIZE),ttLock=new Int32Array(TT_SIZE);
var ttDepth=new Int8Array(TT_SIZE).fill(-1);
var ttFlag=new Int8Array(TT_SIZE),ttScore=new Int32Array(TT_SIZE),ttMove=new Int32Array(TT_SIZE);
var ttStaticEval=new Int32Array(TT_SIZE);
var killers=new Int32Array(MAX_PLY*2);
var historyTable=new Int32Array(64*64);
var counterMoves=new Int32Array(64*64);
var captureHistory=new Int32Array(144);
var contHist1=new Int32Array(8*64*8*64);
var MVV=[0,100,320,330,500,900,0];

function contHistIdx(prevPiece,prevTo,thisPiece,thisTo){
  return ((prevPiece&7)*64+prevTo)*(8*64)+(thisPiece&7)*64+thisTo;
}
function capHistIdx(attackerP,victimP){
  return (((attackerP>>3)*6+(attackerP&7)-1)*12)+((victimP>>3)*6+(victimP&7)-1);
}

function scoreMoves(ply,n,ttM){
  var base=ply*256;
  var k1=killers[ply*2],k2=killers[ply*2+1];
  var cm=0;
  if(hIdx>0){var prev=hMove[hIdx-1];if(prev!==0)cm=counterMoves[(prev&63)*64+((prev>>6)&63)];}
  for(var i=0;i<n;i++){
    var m=mStack[base+i],s;
    if(m===ttM&&ttM!==0)s=3000000;
    else{
      var from=m&63,to=(m>>6)&63,promo=(m>>12)&7,flag=(m>>15)&7;
      var victim=board[to];
      if(flag===FLAG_EP)victim=pc(PAWN,side^1);
      var attacker=board[from];
      if(victim!==0){
        var vt=victim&7,at=attacker&7;
        var ch=captureHistory[capHistIdx(attacker,victim)]>>4;
        var mvvLva=MVV[vt]*10-MVV[at];
        var vw;
        if(MVV[vt]>=MVV[at]+200) vw=1;
        else if(MVV[at]>=MVV[vt]+300) vw=0;
        else vw=seeGE(m,0);
        if(promo)s=vw?(2500000+MVV[promo]+MVV[vt]+ch):(500000+MVV[promo]+MVV[vt]+ch);
        else     s=vw?(2000000+mvvLva+ch):(-100000+mvvLva+ch);
      } else if(promo)s=1500000+MVV[promo];
      else if(m===k1)s=800000;
      else if(m===k2)s=790000;
      else if(cm!==0&&m===cm)s=780000;
      else {
        s=historyTable[from*64+to]>>4;
        if(hIdx>0){
          var prevCH=hMove[hIdx-1];
          if(prevCH!==0){
            var prevPieceCH=hMovedPiece[hIdx-1];
            s+=contHist1[contHistIdx(prevPieceCH,mTo(prevCH),attacker,to)]>>3;
          }
        }
      }
    }
    sStack[base+i]=s;
  }
}

var nodes=0,startTime=0,timeLimit=1e9,stopped=false,rootDepthLimit=6;
var MOVE_OVERHEAD=150;

function checkTime(){if((nodes&2047)===0){if(Date.now()-startTime>timeLimit)stopped=true}}
function isRepetition(){
  var lim=halfmove<posN?halfmove:posN;
  for(var k=posN-3;k>=0&&k>=posN-1-lim;k-=2){if(posHlo[k]===hashLo&&posHhi[k]===hashHi)return true;}
  return false;
}
function countGameReps(){
  var lim=halfmove<posN?halfmove:posN;
  var cnt=1;
  for(var k=posN-3;k>=0&&k>=posN-1-lim;k-=2){if(posHlo[k]===hashLo&&posHhi[k]===hashHi)cnt++;}
  return cnt;
}
function hasNonPawn(c){
  var idx0=(c===WHITE)?1:7;
  return (BB_LO[idx0]|BB_HI[idx0]|BB_LO[idx0+1]|BB_HI[idx0+1]|BB_LO[idx0+2]|BB_HI[idx0+2]|BB_LO[idx0+3]|BB_HI[idx0+3])!==0;
}

function quiesce(alpha,beta,ply){
  if(stopped)return 0;
  checkTime();
  nodes++;
  if(ply>=MAX_PLY-1)return evaluate();
  var checked=isAttacked(kingSq[side],side^1);
  var n;
  var stand=0;
  if(checked){n=genMoves(ply,false);}
  else{stand=evaluate();if(stand>=beta)return stand;if(stand>alpha)alpha=stand;n=genMoves(ply,true);}
  var base=ply*256;
  scoreMoves(ply,n,0);
  var best=checked?-INF:alpha,legal=0;
  for(var i=0;i<n;i++){
    var bi=i;
    for(var j=i+1;j<n;j++)if(sStack[base+j]>sStack[base+bi])bi=j;
    if(bi!==i){
      var tm=mStack[base+i];mStack[base+i]=mStack[base+bi];mStack[base+bi]=tm;
      var ts=sStack[base+i];sStack[base+i]=sStack[base+bi];sStack[base+bi]=ts;
    }
    var m=mStack[base+i];
    if(!checked){var victim=board[mTo(m)];var gain=victim?MVV[victim&7]:0;if(!gain)gain=100;if(stand+gain+200<alpha)continue;}
    makeMove(m);
    if(inCheck(side^1)){unmakeMove();continue}
    legal++;
    var score=-quiesce(-beta,-alpha,ply+1);
    unmakeMove();
    if(stopped)return 0;
    if(score>best)best=score;
    if(score>alpha)alpha=score;
    if(alpha>=beta)break;
  }
  if(checked&&legal===0)return -MATE+ply;
  return best;
}

function negamax(depth,alpha,beta,ply,allowNull){
  if(stopped)return 0;
  checkTime();
  nodes++;
  if(ply>0){
    if(halfmove>=100)return 0;
    if(isRepetition())return 0;
    if(ply>=MAX_PLY-1)return evaluate();
    if(alpha<-MATE+ply)alpha=-MATE+ply;
    if(beta>MATE-ply-1)beta=MATE-ply-1;
    if(alpha>=beta)return alpha;
  }
  var isPv=(beta-alpha)>1;
  var checked=isAttacked(kingSq[side],side^1);
  if(checked && ply < rootDepthLimit*2 && depth < rootDepthLimit*2) depth++;
  if(depth<=0)return quiesce(alpha,beta,ply);
  var idx=hashLo&TT_MASK;
  var ttM=0;
  var ttHit=(ttDepth[idx]>=0&&ttKey[idx]===hashLo&&ttLock[idx]===hashHi);
  if(ttHit){
    ttM=ttMove[idx];
    if(ply>0&&!isPv&&ttDepth[idx]>=depth){
      var s2=ttScore[idx];
      if(s2>MATE-1000)s2-=ply;else if(s2<-MATE+1000)s2+=ply;
      var fl=ttFlag[idx];
      if(fl===0)return s2;
      if(fl===1&&s2>=beta)return s2;
      if(fl===2&&s2<=alpha)return s2;
    }
  }
  var staticEval = ttHit ? ttStaticEval[idx] : evaluate();
  if(!isPv&&!checked&&depth<=3&&Math.abs(alpha)<MATE-1000&&Math.abs(beta)<MATE-1000){
    var margin=80+60*depth;
    if(staticEval-margin>=beta)return staticEval;
  }
  if(!isPv&&!checked&&allowNull&&depth>=3&&ply>0&&staticEval>=beta
   &&Math.abs(beta)<MATE-1000 && hasNonPawn(side)){
    var R=2+(depth>6?1:0);
    makeNull();
    var ns=-negamax(depth-1-R,-beta,-beta+1,ply+1,false);
    unmakeNull();
    if(stopped)return 0;
    if(ns>=beta)return (ns>MATE-1000)?beta:ns;
  }
  if(ttM===0 && depth>=4 && !checked && isPv){depth--;}
  var n=genMoves(ply,false);
  var base=ply*256;
  scoreMoves(ply,n,ttM);
  var best=-INF,bestMove=0,legal=0;
  var origAlpha=alpha;
  for(var i=0;i<n;i++){
    var bi=i;
    for(var j=i+1;j<n;j++)if(sStack[base+j]>sStack[base+bi])bi=j;
    if(bi!==i){
      var tm=mStack[base+i];mStack[base+i]=mStack[base+bi];mStack[base+bi]=tm;
      var ts=sStack[base+i];sStack[base+i]=sStack[base+bi];sStack[base+bi]=ts;
    }
    var m=mStack[base+i];
    var toSq=mTo(m),flagM=mFlag(m);
    var quiet=(board[toSq]===0)&&flagM!==FLAG_EP;
    if(!isPv&&!checked&&quiet&&depth<=3&&legal>3+depth*depth)continue;
    var _movedPiece = board[mFrom(m)];
    var _victimPiece = (flagM===FLAG_EP) ? pc(PAWN, side^1) : board[toSq];
    makeMove(m);
    if(inCheck(side^1)){unmakeMove();continue}
    legal++;
    var newDepth=depth-1,score,extension=0;
    if(!quiet&&hIdx>=2){
      var prev=hMove[hIdx-2];
      if(prev!==0&&mTo(prev)===toSq){
        var captured=hCap[hIdx-1];
        if(captured!==0&&(captured&7)===PAWN)extension+=1;
      }
    }
    var extDepth=newDepth+extension;
    if(legal===1)score=-negamax(extDepth,-beta,-alpha,ply+1,true);
    else{
      var red=0;
      if(depth>=3&&legal>=4&&quiet&&!checked&&newDepth>=3){
        red=1;
        if(depth>=6&&legal>=6)red=2;
        if(isPv)red=Math.max(0,red-1);
        if(red>newDepth-3)red=Math.max(0,newDepth-3);
      }
      score=-negamax(extDepth-red,-alpha-1,-alpha,ply+1,true);
      if(score>alpha&&red>0)score=-negamax(extDepth,-alpha-1,-alpha,ply+1,true);
      if(score>alpha&&score<beta)score=-negamax(extDepth,-beta,-alpha,ply+1,true);
    }
    unmakeMove();
    if(stopped)return 0;
    if(hIdx >= 2){
      var prev2 = hMove[hIdx-2];
      if(prev2 !== 0 && mFrom(prev2) === mTo(m) && mTo(prev2) === mFrom(m)){score -= 8;}
    }
    if(score>best){best=score;bestMove=m}
    if(score>alpha){
      alpha=score;
      if(alpha>=beta){
        if(quiet){
          if(killers[ply*2]!==m){killers[ply*2+1]=killers[ply*2];killers[ply*2]=m;}
          var hi=(m&63)*64+((m>>6)&63);
          historyTable[hi]+=depth*depth;
          if(historyTable[hi]>1000000){for(var z=0;z<historyTable.length;z++)historyTable[z]>>=1;}
          if(hIdx>0){var prevCM=hMove[hIdx-1];if(prevCM!==0)counterMoves[(prevCM&63)*64+((prevCM>>6)&63)]=m;}
          if(hIdx>0){
            var prevCH=hMove[hIdx-1];
            if(prevCH!==0){
              var prevPieceCH=hMovedPiece[hIdx-1];
              var cIdx=contHistIdx(prevPieceCH,mTo(prevCH),_movedPiece,toSq);
              contHist1[cIdx]+=depth*depth;
              if(contHist1[cIdx]>1000000){for(var zc=0;zc<contHist1.length;zc++)contHist1[zc]>>=1;}
            }
          }
        } else {
          if(_movedPiece && _victimPiece){
            var chi=capHistIdx(_movedPiece, _victimPiece);
            captureHistory[chi]+=depth*depth;
            if(captureHistory[chi]>1000000){for(var z2=0;z2<captureHistory.length;z2++)captureHistory[z2]>>=1;}
          }
        }
        break;
      }
    }
  }
  if(legal===0)return checked?(-MATE+ply):0;
  var flag2=(best<=origAlpha)?2:((best>=beta)?1:0);
  var storeScore=best;
  if(storeScore>MATE-1000)storeScore+=ply;
  else if(storeScore<-MATE+1000)storeScore-=ply;
  if(ttDepth[idx]<0||depth>=ttDepth[idx]||ttKey[idx]!==hashLo||ttLock[idx]!==hashHi){
    ttKey[idx]=hashLo;ttLock[idx]=hashHi;ttDepth[idx]=depth;
    ttFlag[idx]=flag2;ttScore[idx]=storeScore;ttMove[idx]=bestMove;
    ttStaticEval[idx]=staticEval;
  }
  return best;
}

function searchRoot(depth,alpha,beta,prevBest){
  var n=genMoves(0,false);
  scoreMoves(0,n,prevBest);
  var best=-INF,bestM=0,legal=0;
  for(var i=0;i<n;i++){
    var bi=i;
    for(var j=i+1;j<n;j++)if(sStack[j]>sStack[bi])bi=j;
    if(bi!==i){
      var tm=mStack[i];mStack[i]=mStack[bi];mStack[bi]=tm;
      var ts=sStack[i];sStack[i]=sStack[bi];sStack[bi]=ts;
    }
    var m=mStack[i];
    makeMove(m);
    if(inCheck(side^1)){unmakeMove();continue}
    legal++;
    var score;
    if(legal===1)score=-negamax(depth-1,-beta,-alpha,1,true);
    else{
      score=-negamax(depth-1,-alpha-1,-alpha,1,true);
      if(score>alpha&&score<beta)score=-negamax(depth-1,-beta,-alpha,1,true);
    }
    unmakeMove();
    if(stopped)break;
    if(score>best){best=score;bestM=m}
    if(score>alpha)alpha=score;
  }
  if(legal===0)return{score:isAttacked(kingSq[side],side^1)?-MATE:0,move:0,complete:true};
  return{score:best,move:bestM,complete:!stopped};
}

function search(maxDepth,timeMs){
  nodes=0;stopped=false;startTime=Date.now();
  var softLimit=1e12,hardLimit=1e12;
  if(timeMs&&timeMs>0){
    softLimit = Math.max(50, timeMs * 0.55 - MOVE_OVERHEAD);
    hardLimit = Math.max(100, timeMs * 0.85 - MOVE_OVERHEAD);
    if(fullmove < 10){ softLimit *= 0.7; hardLimit *= 0.85; }
    else if(fullmove >= 40){ softLimit *= 1.15; hardLimit *= 1.05; }
  }
  timeLimit = hardLimit;
  killers.fill(0);
  for(var hi=0;hi<64*64;hi++)historyTable[hi]=(historyTable[hi]>>1);
  counterMoves.fill(0);
  captureHistory.fill(0);
  contHist1.fill(0);
  var legalMoves=generateLegalMoves();
  if(legalMoves.length===0)return{move:0,score:0,depth:0,nodes:0,time:0};
  if(legalMoves.length===1)return{move:legalMoves[0],score:0,depth:1,nodes:0,time:0};
  var bestMove=legalMoves[0],bestScore=0,completedDepth=0,prevBest=0,noProgress=-1;
  var failHigh=0,failLow=0,stableCount=0;
  for(var d=1;d<=maxDepth;d++){
    rootDepthLimit=d;
    var alpha=-INF,beta=INF;
    if(d>=4&&Math.abs(bestScore)<MATE-1000){
      var window=25+5*(failHigh+failLow);
      if(window>100)window=100;
      alpha=bestScore-window; beta=bestScore+window;
    }
    var res=null,guard=0;
    var thisFailHigh=false,thisFailLow=false;
    while(guard++<12){
      res=searchRoot(d,alpha,beta,prevBest);
      if(stopped)break;
      if(Math.abs(res.score)>MATE-1000)break;
      if(res.score<=alpha){thisFailLow=true;beta=res.score+1;alpha=-INF;continue;}
      if(res.score>=beta){thisFailHigh=true;alpha=res.score-1;beta=INF;continue;}
      break;
    }
    if(stopped)break;
    if(!res||!res.complete)break;
    if(res.move){
      if(res.move===bestMove){noProgress++;stableCount++;}
      else {noProgress=0;stableCount=0;}
      bestMove=res.move;prevBest=res.move;
    }
    bestScore=res.score;completedDepth=d;
    if(thisFailHigh)failHigh++;else failHigh=Math.max(0,failHigh-1);
    if(thisFailLow)failLow++;else failLow=Math.max(0,failLow-1);
    if(global.onSearchInfo)global.onSearchInfo({depth:d,score:bestScore,nodes:nodes,move:bestMove,time:Date.now()-startTime});
    if(Math.abs(bestScore)>MATE-1000)break;
    var elapsed=Date.now()-startTime;
    if(timeMs&&timeMs>0){
      if(elapsed>=hardLimit)break;
      var expectedNext=elapsed*2;
      if(elapsed+expectedNext>hardLimit)break;
      if(elapsed>softLimit){
        if(stableCount>=3)break;
        if(noProgress>=3)break;
      }
      if(stableCount>=5&&elapsed>softLimit*0.5)break;
    }
  }
  return{move:bestMove,score:bestScore,depth:completedDepth,nodes:nodes,time:Date.now()-startTime,stopped:stopped};
}

var LETTERS=['','','N','B','R','Q','K'];
function moveToSan(m){
  var from=m&63,to=mTo(m),promo=mPromo(m),flag=mFlag(m);
  var p=board[from],t=p&7;
  var capture=(board[to]!==0)||(flag===FLAG_EP);
  var san;
  if(flag===FLAG_CASTLE)san=(to===62||to===6)?'O-O':'O-O-O';
  else if(t===PAWN){
    san=capture?('abcdefgh'[from&7]+'x'+idxToAlg(to)):idxToAlg(to);
    if(promo)san+='='+LETTERS[promo];
  } else {
    var legal=generateLegalMoves();
    var sameFile=false,sameRank=false,any=false;
    for(var i=0;i<legal.length;i++){
      var mm=legal[i];
      if(mm===m)continue;
      if(mTo(mm)!==to)continue;
      if(board[mFrom(mm)]!==p)continue;
      any=true;
      if((mFrom(mm)&7)===(from&7))sameFile=true;
      if(((mFrom(mm)>>3)&7)===(from>>3))sameRank=true;
    }
    var dis='';
    if(any){
      if(!sameFile)dis='abcdefgh'[from&7];
      else if(!sameRank)dis=String(8-(from>>3));
      else dis='abcdefgh'[from&7]+String(8-(from>>3));
    }
    san=LETTERS[t]+dis+(capture?'x':'')+idxToAlg(to);
  }
  makeMove(m);
  var opp=side;
  var oppLegal=generateLegalMoves();
  if(isAttacked(kingSq[opp],opp^1))san+=(oppLegal.length===0)?'#':'+';
  unmakeMove();
  return san;
}

function insufficientMaterial(){
  var wB=0,bB=0,wN=0,bN=0,wBc=[0,0],bBc=[0,0];
  for(var i=0;i<64;i++){
    var p=board[i];if(!p)continue;
    var t=p&7,c=p>>3;
    if(t===PAWN||t===ROOK||t===QUEEN)return false;
    if(t===BISHOP){var color=sqColor(i);if(c===WHITE){wB++;wBc[color]++}else{bB++;bBc[color]++}}
    else if(t===KNIGHT){if(c===WHITE)wN++;else bN++;}
  }
  var wM=wB+wN,bM=bB+bN;
  if(wM===0&&bM===0)return true;
  if(wM+bM===1)return true;
  if(wM===1&&bM===1&&wN===0&&bN===0){if((wBc[0]>0&&bBc[0]>0)||(wBc[1]>0&&bBc[1]>0))return true;}
  return false;
}

function gameStatus(){
  var legal=generateLegalMoves();
  if(legal.length===0){
    if(isAttacked(kingSq[side],side^1)){
      return{over:true,result:(side===WHITE?'0-1':'1-0'),reason:'checkmate',
             text:(side===WHITE?'كش مات — فاز الأسود':'كش مات — فاز الأبيض')};
    }
    return{over:true,result:'1/2-1/2',reason:'stalemate',text:'تعادل — جمود'};
  }
  if(halfmove>=100)return{over:true,result:'1/2-1/2',reason:'fifty',text:'تعادل — 50 نقلة'};
  if(countGameReps()>=3)return{over:true,result:'1/2-1/2',reason:'repetition',text:'تعادل — تكرار'};
  if(insufficientMaterial())return{over:true,result:'1/2-1/2',reason:'material',text:'تعادل — قطع غير كافية'};
  return{over:false,text:(side===WHITE?'دور الأبيض':'دور الأسود')};
}

function getPositionHistory(){
  var out=new Array(posN);
  for(var i=0;i<posN;i++)out[i]=[posHlo[i],posHhi[i]];
  return out;
}

  var matches=[];
  for(var i=0;i<legalFromSelected.length;i++)if(E.mTo(legalFromSelected[i])===sq)matches.push(legalFromSelected[i]);
  if(matches.length===0)return false;
  if(matches.length>1){pendingPromo=matches;showPromo(matches);return true}
  applyMove(matches[0],true);afterHumanMove();return true;
}
function afterHumanMove(){
  var gs=E.gameStatus();
  if(gs.over){gameOver=true;stateTxt.textContent=gs.text;turnTxt.textContent='انتهت اللعبة';return;}
  if(E.getSide()!==humanColor){stateTxt.textContent='المحرك يفكر…';setTimeout(engineTurn,60);}
  else stateTxt.textContent='دورك';
}
function showPromo(moves){
  promoOpts.innerHTML='';
  var order=[E.QUEEN,E.ROOK,E.BISHOP,E.KNIGHT];
  order.forEach(function(t){
    var d=document.createElement('div');
    d.textContent=GLYPH[t];
    d.style.color=(humanColor===E.WHITE)?'#fff':'#1b1b1e';
    d.style.textShadow=(humanColor===E.WHITE)
      ?'1px 1px 0 #222,-1px 1px 0 #222,1px -1px 0 #222,-1px -1px 0 #222'
      :'1px 1px 0 #ddd,-1px 1px 0 #ddd,1px -1px 0 #ddd,-1px -1px 0 #ddd';
    d.addEventListener('click',function(){
      var found=null;
      for(var i=0;i<pendingPromo.length;i++)if(E.mPromo(pendingPromo[i])===t){found=pendingPromo[i];break}
      promoEl.classList.remove('on');pendingPromo=null;
      if(found!==null){applyMove(found,true);afterHumanMove();}
    });
    promoOpts.appendChild(d);
  });
  promoEl.classList.add('on');
}

function undoMove(){
  if(thinking){searchId++;thinking=false;if(worker){try{worker.postMessage({cmd:'stop'})}catch(e){}}}
  var steps=0;
  while(pliesPlayed>0&&steps<2){
    E.unmakeMove();pliesPlayed--;sanList.pop();lastMoveHistory.pop();steps++;
    if(E.getSide()===humanColor)break;
  }
  if(steps===0)return;
  gameOver=false;searchId++;
  selected=-1;legalFromSelected=[];
  lastMove=lastMoveHistory.length?lastMoveHistory[lastMoveHistory.length-1]:null;
  renderPieces();renderHighlights();renderMoves();updateStatus();
  if(E.getSide()!==humanColor){stateTxt.textContent='المحرك يفكر…';setTimeout(engineTurn,60);}
  else stateTxt.textContent='دورك';
}

function sendBookToWorker(buffer){
  if(!worker){
    setBookStatus('❌ الـ Worker غير متاح — التحميل اليدوي لا يمكن أن ينجح','');
    return;
  }
  try{
    worker.postMessage({cmd:'loadBook',buffer:buffer},[buffer]);
    setBookStatus('📤 أُرسل الكتاب للـ Worker — جاري التحليل...','loading');
  }catch(e){
    console.error('book transfer failed:', e);
    setBookStatus('❌ فشل إرسال الكتاب للـ Worker: ' + (e.message||e), '');
  }
}

function fetchWithProgress(url){
  return fetch(url,{cache:'no-cache'}).then(function(resp){
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    var total = parseInt(resp.headers.get('content-length')||'0',10);
    var reader = resp.body && resp.body.getReader ? resp.body.getReader() : null;
    if(!reader) return resp.arrayBuffer();
    var chunks=[], received=0;
    function step(){
      return reader.read().then(function(r){
        if(r.done){
          var out=new Uint8Array(received), off=0;
          for(var i=0;i<chunks.length;i++){ out.set(chunks[i],off); off+=chunks[i].length; }
          return out.buffer;
        }
        chunks.push(r.value);
        received += r.value.length;
        if(total>0){
          setProgress((received/total)*100);
          var mb=(received/1048576).toFixed(2);
          var tmb=(total/1048576).toFixed(2);
          setBookStatus('تحميل '+mb+' / '+tmb+' MB','loading');
        } else {
          setBookStatus('تحميل '+(received/1048576).toFixed(2)+' MB','loading');
        }
        return step();
      });
    }
    return step();
  });
}

function autoDetectBook(){
  var candidates = [BOOK_FILE].concat(BOOK_FALLBACKS);
  showProgress(true); setProgress(0);
  var i = 0;
  function next(){
    if(i >= candidates.length){ showProgress(false); setBookStatus('لم يُعثر على الكتاب — استخدم "📁 يدوي"',''); return Promise.resolve(false); }
    var url = candidates[i++];
    setBookStatus('جاري تجربة: '+url,'loading');
    return fetchWithProgress(url).then(function(buf){ sendBookToWorker(buf); return true; })
      .catch(function(err){ console.warn('[Book] فشل',url,'-',err.message); return next(); });
  }
  return next();
}

bookFileBtn.addEventListener('click',function(){bookFileEl.click()});
bookFileEl.addEventListener('change',async function(ev){
  var file=ev.target.files[0];
  if(!file)return;
  setBookStatus('جاري التحميل: '+file.name,'loading');
  showProgress(true); setProgress(0);
  try{
    var reader=new FileReader();
    var buf=await new Promise(function(resolve,reject){
      reader.onload=function(){resolve(reader.result)};
      reader.onerror=function(){reject(reader.error)};
      reader.onprogress=function(e){
        if(e.lengthComputable){
          setProgress((e.loaded/e.total)*100);
          var mb=(e.loaded/1048576).toFixed(2);
          var tmb=(e.total/1048576).toFixed(2);
          setBookStatus('تحميل '+mb+' / '+tmb+' MB','loading');
        }
      };
      reader.readAsArrayBuffer(file);
    });
    sendBookToWorker(buf);
  }catch(err){ showProgress(false); setBookStatus('خطأ: '+err.message,''); }
});

function waitForPolyglot(){
  return new Promise(function(resolve){
    var pg = window.POLYGLOT_RANDOM;
    if(pg){
      var isFlat   = (pg.length >= 1562) && (typeof pg[0] === 'number');
      var isPaired = (pg.length >= 781)  && Array.isArray(pg[0]);
      if(isFlat || isPaired) return resolve(pg);
    }
    if(window.POLYGLOT_RANDOM_PROMISE){
      return window.POLYGLOT_RANDOM_PROMISE.then(function(data){
        var p = data || window.POLYGLOT_RANDOM;
        if(p){
          var okFlat   = (p.length >= 1562) && (typeof p[0] === 'number');
          var okPaired = (p.length >= 781)  && Array.isArray(p[0]);
          if(okFlat || okPaired) return resolve(p);
        }
        resolve(null);
      }).catch(function(){ resolve(null); });
    }
    resolve(null);
  });
}

function buildWorker(){
  var blobURL = URL.createObjectURL(new Blob([engineSrc], {type:'application/javascript'}));
  var workerSrc =
    'importScripts(' + JSON.stringify(blobURL) + ');\n' +
    'var currentId = 0;\n' +
    'var book = null;\n' +
    'var bookMaxPlies = ' + DEFAULT_BOOK_PLIES + ';\n' +
    'self.Engine.onSearchInfo = function(info){\n' +
    '  self.postMessage({type:"info", id:currentId, depth:info.depth, score:info.score, nodes:info.nodes});\n' +
    '};\n' +
    'function parseBin(buffer){\n' +
    '  var view = new DataView(buffer);\n' +
    '  var map = new Map();\n' +
    '  for (var i = 0; i + 16 <= buffer.byteLength; i += 16) {\n' +
    '    var keyHi = view.getUint32(i, false);\n' +
    '    var keyLo = view.getUint32(i + 4, false);\n' +
    '    var mv = view.getUint16(i + 8, false);\n' +
    '    var w  = view.getUint16(i + 10, false);\n' +
    '    var key = (keyHi>>>0) + ":" + (keyLo>>>0);\n' +
    '    var arr = map.get(key);\n' +
    '    if (!arr) { arr = []; map.set(key, arr); }\n' +
    '    arr.push({mv:mv, w:w});\n' +
    '  }\n' +
    '  return map;\n' +
    '}\n' +
    'function pickBookMove(){\n' +
    '  if (!book) return null;\n' +
    '  if (!self.Engine.isPolyglotReady || !self.Engine.isPolyglotReady()) return null;\n' +
    '  var key = self.Engine.polyglotHash();\n' +
    '  if (!key) return null;\n' +
    '  var entries = book.get(key);\n' +
    '  if (!entries || !entries.length) return null;\n' +
    '  var total = 0;\n' +
    '  for (var j = 0; j < entries.length; j++) total += entries[j].w;\n' +
    '  var r = Math.random() * total;\n' +
    '  var chosen = entries[entries.length-1].mv;\n' +
    '  for (var k = 0; k < entries.length; k++) {\n' +
    '    r -= entries[k].w;\n' +
    '    if (r <= 0) { chosen = entries[k].mv; break; }\n' +
    '  }\n' +
    '  var from = chosen & 63;\n' +
    '  var to = (chosen >> 6) & 63;\n' +
    '  var promo = (chosen >> 12) & 7;\n' +
    '  var promoMap = [0, self.Engine.KNIGHT, self.Engine.BISHOP, self.Engine.ROOK, self.Engine.QUEEN];\n' +
    '  var fromE = (7 - (from >> 3)) * 8 + (from & 7);\n' +
    '  var toE   = (7 - (to   >> 3)) * 8 + (to   & 7);\n' +
    '  var p = promoMap[promo] || 0;\n' +
    '  var m = (fromE | (toE << 6) | (p << 12)) | 0;\n' +
    '  var legal = self.Engine.legalMoves();\n' +
    '  for (var l = 0; l < legal.length; l++) {\n' +
    '    if (legal[l] === m) return m;\n' +
    '    if (promo && (legal[l] & 0x7FFF) === (m & 0x7FFF)) return legal[l];\n' +
    '  }\n' +
    '  return null;\n' +
    '}\n' +
    'self.onmessage = function(e){\n' +
    '  var d = e.data;\n' +
    '  if (d.cmd === "setPolyglotConstants") {\n' +
    '    self.Engine.setPolyglotConstants(d.data);\n' +
    '    self.postMessage({type:"polyglotReady"});\n' +
    '    return;\n' +
    '  }\n' +
    '  if (d.cmd === "loadBook") {\n' +
    '    try { book = parseBin(d.buffer); } catch(err) { book = null; }\n' +
    '    self.postMessage({type:"bookLoaded", count: book ? book.size : 0});\n' +
    '  } else if (d.cmd === "setBookPlies") {\n' +
    '    bookMaxPlies = d.value | 0;\n' +
    '  } else if (d.cmd === "search") {\n' +
    '    currentId = d.id;\n' +
    '    self.Engine.setFen(d.fen, { prevHashes: d.prevHashes, newGame: d.newGame });\n' +
    '    if (d.plyCount < bookMaxPlies) {\n' +
    '      var bm = pickBookMove();\n' +
    '      if (bm) {\n' +
    '        self.postMessage({type:"bestmove", id:d.id, move:bm, score:0, depth:0, nodes:0, time:0, fromBook:true});\n' +
    '        return;\n' +
    '      }\n' +
    '    }\n' +
    '    var r = self.Engine.search(d.depth, d.timeLimit);\n' +
    '    self.postMessage({type:"bestmove", id:d.id, move:r.move, score:r.score, depth:r.depth, nodes:r.nodes, time:r.time});\n' +
    '  } else if (d.cmd === "stop") {\n' +
    '    self.Engine.stopSearch();\n' +
    '  }\n' +
    '};';
  var wURL = URL.createObjectURL(new Blob([workerSrc], {type:'application/javascript'}));
  try {
    worker = new Worker(wURL);
    attachWorkerHandlers(worker);
    return true;
  } catch(e) {
    console.warn('فشل إنشاء Worker:', e);
    worker = null;
    return false;
  }
}

  } else {
    setBookStatus('⚠ polyglot-constants.js غير محمّل — الكتاب معطّل','');
  }
  var ok = buildWorker();
  if(!ok){ setBookStatus('⚠ Worker غير مدعوم — سيُستخدم البحث المباشر',''); }
  if(pg && worker){
    var arr = Array.from(pg);
    worker.postMessage({cmd:'setPolyglotConstants', data: arr});
    setTimeout(autoDetectBook, 300);
  } else if(!pg){
    bookReloadBtn.disabled = true;
    bookFileBtn.disabled = true;
  }
});
